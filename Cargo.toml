[package]
name = "hyprfast"
version = "0.1.0"
edition = "2021"
description = "Fast hypruse alternative: persistent Hyprland IPC + direct AT-SPI, MCP + CLI"
license = "MIT"

[[bin]]
name = "hyprfast"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rmcp = { version = "0.6", features = ["server", "transport-io"] }
schemars = "0.8"
zbus = { version = "5", default-features = false, features = ["tokio"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.27", features = ["user"] }
regex = "1"
